name: Android Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/upload.keystore
      STORE_PASSWORD: ci-upload-pass
      KEY_PASSWORD: ci-upload-pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Generate CI keystores
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Convert264 CI, OU=CI, O=CI, L=CI, ST=CI, C=US" -noprompt
          keytool -genkeypair -keystore upload.keystore -storepass ci-upload-pass -alias upload -keypass ci-upload-pass -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Convert264 CI, OU=CI, O=CI, L=CI, ST=CI, C=US" -noprompt
      - name: Unit tests
        run: gradle testPlayDebugUnitTest --no-daemon
      - name: Build release APK
        run: gradle assemblePlayRelease --no-daemon
      # Play Store needs an AAB, not the APK. Built from the same
      # tag so the store build is byte-identical in code to the
      # sideload APK. Signing note: CI signs with a throwaway
      # keystore — the AAB is a build artifact, NOT the Play upload.
      # The first Play upload must use a stable upload keystore
      # (see tool/play-store/listing.md).
      - name: Build release AAB (Play Store upload)
        run: gradle bundlePlayRelease --no-daemon
      # Flavors rename the outputs (app-play-release.apk/.aab); the
      # public download URLs use the plain names, so copy them back
      # before the audit and the release upload.
      # The bundle layout is NOT hardcoded: AGP 9.1.1 + flavors put
      # the AAB somewhere other than bundle/play/release/ (v0.2.6
      # release run 44149629843 failed on the hardcoded cp while
      # bundlePlayRelease itself was BUILD SUCCESSFUL). Locate both
      # artifacts by search and fail loudly if either is missing or
      # ambiguous, instead of guessing the layout again.
      - name: Restore plain release file names
        run: |
          mkdir -p app/build/outputs/apk/release app/build/outputs/bundle/release
          APK=$(find app/build/outputs/apk -name 'app-play-release.apk' -print -quit)
          AAB=$(find app/build/outputs/bundle -name '*.aab' -print -quit)
          [ -n "$APK" ] || { echo "ERROR: no app-play-release.apk under app/build/outputs/apk"; find app/build/outputs/apk -type f | head -20; exit 1; }
          [ -n "$AAB" ] || { echo "ERROR: no .aab under app/build/outputs/bundle"; find app/build/outputs/bundle -type f | head -20; exit 1; }
          [ "$(find app/build/outputs/bundle -name '*.aab' | wc -l)" -eq 1 ] || { echo "ERROR: ambiguous AABs:"; find app/build/outputs/bundle -name '*.aab'; exit 1; }
          echo "APK built at: $APK"
          echo "AAB built at: $AAB"
          cp "$APK" app/build/outputs/apk/release/app-release.apk
          cp "$AAB" app/build/outputs/bundle/release/app-release.aab
      - name: Audit merged manifest in the built APK
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging app/build/outputs/apk/release/app-release.apk | tee /tmp/badging.txt
          grep -q "package: name='dev.dzianisv.convert264'" /tmp/badging.txt
          grep -q "versionName='${GITHUB_REF_NAME#v}'" /tmp/badging.txt
          grep -q "uses-permission: name='android.permission.READ_EXTERNAL_STORAGE'" /tmp/badging.txt
          echo "Manifest audit passed"
      - name: Audit share intent filters in the built APK
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump xmltree --file AndroidManifest.xml app/build/outputs/apk/release/app-release.apk | tee /tmp/manifest-tree.txt
          grep -q "android.intent.action.SEND" /tmp/manifest-tree.txt
          grep -q "android.intent.action.SEND_MULTIPLE" /tmp/manifest-tree.txt
          grep -q "android.intent.action.VIEW" /tmp/manifest-tree.txt
          grep -q 'android:mimeType.*="video/\*"' /tmp/manifest-tree.txt
          grep -q 'android:scheme.*="content"' /tmp/manifest-tree.txt
          grep -q 'android:scheme.*="file"' /tmp/manifest-tree.txt
          echo "Share intent filters present in shipped APK (SEND, SEND_MULTIPLE, VIEW + video/*, content/file schemes)"
      - name: Check release APK is not obfuscated
        run: |
          unzip -p app/build/outputs/apk/release/app-release.apk classes.dex | strings | grep -q 'Lkotlin/coroutines/Continuation;' && echo "dex not obfuscated (Continuation descriptor present)"
      - uses: softprops/action-gh-release@v2
        with:
          name: Convert264 ${{ github.ref_name }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
          body: |
            Convert264 ${{ github.ref_name }} — clean, ad-free universal video converter (native Kotlin + Jetpack Compose, FFmpeg engine): queue, codec/container/audio choice, per-file trim.

            **Signing note:** this APK is signed with a throwaway keystore generated in CI. A future properly-signed build will need a reinstall, not an update.
