name: Android Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/upload.keystore
      STORE_PASSWORD: ci-upload-pass
      KEY_PASSWORD: ci-upload-pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Generate CI keystores
        run: |
          keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Convert264 CI, OU=CI, O=CI, L=CI, ST=CI, C=US" -noprompt
          keytool -genkeypair -keystore upload.keystore -storepass ci-upload-pass -alias upload -keypass ci-upload-pass -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Convert264 CI, OU=CI, O=CI, L=CI, ST=CI, C=US" -noprompt
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - name: Audit merged manifest in the built APK
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging app/build/outputs/apk/release/app-release.apk | tee /tmp/badging.txt
          grep -q "package: name='dev.dzianisv.convert264'" /tmp/badging.txt
          grep -q "versionName='${GITHUB_REF_NAME#v}'" /tmp/badging.txt
          grep -q "uses-permission: name='android.permission.READ_EXTERNAL_STORAGE'" /tmp/badging.txt
          echo "Manifest audit passed"
      - name: Audit share intent filters in the built APK
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump xmltree --file AndroidManifest.xml app/build/outputs/apk/release/app-release.apk | tee /tmp/manifest-tree.txt
          grep -q "android.intent.action.SEND" /tmp/manifest-tree.txt
          grep -q "android.intent.action.SEND_MULTIPLE" /tmp/manifest-tree.txt
          grep -q "android.intent.action.VIEW" /tmp/manifest-tree.txt
          grep -q 'android:mimeType.*="video/\*"' /tmp/manifest-tree.txt
          grep -q 'android:scheme.*="content"' /tmp/manifest-tree.txt
          grep -q 'android:scheme.*="file"' /tmp/manifest-tree.txt
          echo "Share intent filters present in shipped APK (SEND, SEND_MULTIPLE, VIEW + video/*, content/file schemes)"
      - name: Check release APK is not obfuscated
        run: |
          unzip -p app/build/outputs/apk/release/app-release.apk classes.dex | strings | grep -q 'Lkotlin/coroutines/Continuation;' && echo "dex not obfuscated (Continuation descriptor present)"
      - uses: softprops/action-gh-release@v2
        with:
          name: Convert264 ${{ github.ref_name }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          body: |
            Convert264 ${{ github.ref_name }} — clean, ad-free H.264 MP4 converter (native Kotlin + Jetpack Compose, Media3 Transformer).

            **Signing note:** this APK is signed with a throwaway keystore generated in CI. A future properly-signed build will need a reinstall, not an update.
